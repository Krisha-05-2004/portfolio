<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | Sai Krisha K</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="contact-page">

    <a href="index.html" class="back-link">← Back</a>

    <div class="contact-wrapper">

      <!-- HEADER -->
      <div class="main-contact">
        <h1>Let's Connect 🤝</h1>
        <p>Let's connect and grow together</p>
      </div>

      <!-- EMAIL -->
      <div class="contact-card">
        <div class="contact-icon email">
          <i class="fa-solid fa-envelope"></i>
        </div>
        <div class="contact-info">
          <h3>Email</h3>
          <p>saikrisha05@gmail.com</p>
        </div>
      </div>

      <!-- PHONE -->
      <div class="contact-card">
        <div class="contact-icon phone">
          <i class="fa-solid fa-phone"></i>
        </div>
        <div class="contact-info">
          <h3>Phone</h3>
          <p>+91 81970 67779</p>
        </div>
      </div>

      <!-- LOCATION -->
      <div class="contact-card">
        <div class="contact-icon location">
          <i class="fa-solid fa-location-dot"></i>
        </div>
        <div class="contact-info">
          <h3>Location</h3>
          <p>Bangalore, India</p>
        </div>
      </div>

      <!-- GITHUB -->
      <div class="contact-card">
        <a href="https://github.com/Krisha-05-2004" target="_blank" rel="noopener noreferrer" class="contact-link">
          <div class="contact-icon github">
            <i class="fa-brands fa-github"></i>
          </div>
          <div class="contact-info">
            <h3>GitHub</h3>
            <p>See what I've built</p>
          </div>
        </a>
      </div>

      <!-- LINKEDIN -->
      <div class="contact-card">
        <a href="https://www.linkedin.com/in/sai-krisha-k-b92a7624a/" target="_blank" rel="noopener noreferrer" class="contact-link">
          <div class="contact-icon linkedin">
            <i class="fa-brands fa-linkedin"></i>
          </div>
          <div class="contact-info">
            <h3>LinkedIn</h3>
            <p>Explore my work</p>
          </div>
        </a>
      </div>

      <!-- RESUME -->
      <div class="contact-card">
        <div class="contact-icon" style="background: linear-gradient(135deg, #6366f1, #22c55e); font-size:1.3rem; display:flex; align-items:center; justify-content:center;">
          📄
        </div>
        <div class="contact-info">
          <h3>Resume</h3>
          <a href="assets/resume.pdf" target="_blank" rel="noopener noreferrer" class="resume-btn" style="position:relative;z-index:10;">
            Download Resume
          </a>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
